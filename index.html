<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div id="container-central" class="card shadow">
        
        <h1 class="card-header text-center"> 
            Lista de Tarefas 
        </h1>

        <div class="card-body"> 
            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="Digite a tarefa" name="tarefa" id="inputTarefa" autofocus>
                <button class="btn btn-primary" type="button" id="botao"> Cadastrar </button>
            </div>
        
            <ul id="lista" class="list-group">
            </ul>
        </div>

    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/script.js"></script>
</body>
</html>
